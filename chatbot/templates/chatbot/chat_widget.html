{% load static %}
<div id="chat-widget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end font-sans">
    <!-- Chat Window -->
    <div id="chat-window" class="hidden mb-4 w-[90vw] sm:w-96 h-[500px] max-h-[80vh] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden transition-all duration-300 ease-in-out">
        <!-- Header -->
        <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
            <div class="flex items-center gap-2">
                <div class="p-1.5 bg-white/20 rounded-full">
                    <i data-lucide="sparkles" width="18" height="18"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-sm">Portfolio Assistant</h3>
                    <p class="text-xs text-indigo-100">Powered by Gemini</p>
                </div>
            </div>
            <button id="close-chat" class="p-1 hover:bg-white/20 rounded-full transition-colors">
                <i data-lucide="x" width="20" height="20"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 custom-scrollbar">
            <div class="flex gap-3 justify-start">
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0 text-indigo-600 border border-indigo-200">
                    <i data-lucide="bot" width="16" height="16"></i>
                </div>
                <div class="max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm bg-white text-slate-800 border border-slate-200 rounded-tl-none">
                    Hi! I'm Alex's AI assistant. Ask me anything about his projects, skills, or blog posts.
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chat-form" class="p-4 bg-white border-t border-slate-100">
            <div class="relative flex items-center">
                <input
                    id="chat-input"
                    type="text"
                    placeholder="Ask about projects, skills..."
                    class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                    autocomplete="off"
                />
                <button
                    type="submit"
                    id="send-btn"
                    class="absolute right-2 p-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 disabled:opacity-50 disabled:hover:bg-indigo-600 transition-colors"
                    disabled
                >
                    <i data-lucide="send" width="16" height="16"></i>
                </button>
            </div>
        </form>
    </div>

    <!-- Toggle Button -->
    <button
        id="toggle-chat"
        class="p-4 rounded-full shadow-lg transition-all duration-300 hover:scale-105 active:scale-95 flex items-center justify-center bg-indigo-600 text-white hover:bg-indigo-700"
    >
        <i data-lucide="message-circle" width="28" height="28" id="toggle-icon-open"></i>
        <i data-lucide="x" width="24" height="24" id="toggle-icon-close" class="hidden"></i>
    </button>
</div>

<script src="{% static 'chatbot/js/chat.js' %}"></script>
