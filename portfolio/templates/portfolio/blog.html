{% extends "portfolio/base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-12 text-center">
        <h1 class="text-4xl font-bold text-slate-900 mb-4">Blog</h1>
        <p class="text-slate-600">Thoughts on engineering, design, and the future of the web.</p>
    </div>

    <div class="space-y-12">
        {% for post in posts %}
            <article class="group flex flex-col md:flex-row gap-8 items-start">
                    <div class="w-full md:w-1/3 aspect-[4/3] bg-slate-100 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="{{ post.imageUrl }}" alt="{{ post.title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                    </div>
                    <div class="flex-1">
                    <div class="flex items-center gap-3 text-xs font-medium text-slate-500 mb-3 uppercase tracking-wide">
                        <span>{{ post.date }}</span>
                        <span>•</span>
                        <span>{{ post.readTime }}</span>
                    </div>
                    <a href="{% url 'blog_detail' pk=post.id %}">
                        <h2 class="text-2xl font-bold text-slate-900 mb-3 group-hover:text-indigo-600 transition-colors">{{ post.title }}</h2>
                    </a>
                    <p class="text-slate-600 mb-4 leading-relaxed">{{ post.excerpt }}</p>
                    <a href="{% url 'blog_detail' pk=post.id %}" class="inline-flex items-center text-indigo-600 font-medium hover:text-indigo-700 text-sm">
                        Read Article <i data-lucide="chevron-right" width="16" height="16" class="ml-1"></i>
                    </a>
                    </div>
            </article>
        {% endfor %}
    </div>
</div>
{% endblock %}
